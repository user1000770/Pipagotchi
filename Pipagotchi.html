<style>
:root{--bg:#fff;--fg:#000;--dim:#0002;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--dim:#fff3}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--dim:#fff3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;scrollbar-width:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
::-webkit-scrollbar{display:none;width:0;height:0}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 24px;user-select:none}
#stage{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#msg{font-size:17px;height:24px;margin-bottom:28px}
#wrap{position:relative;width:140px;height:170px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
#shadow{position:absolute;bottom:0;width:100px;height:12px;border-radius:50%;background:var(--dim)}
#ball{position:relative;width:120px;height:120px;border-radius:50%;background:var(--fg);margin-bottom:8px;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite;transition:opacity .6s}
#ball .e{position:absolute;top:44px;width:12px;height:16px;border-radius:50%;background:var(--bg);transition:all .25s}
#ball .e.l{left:34px}#ball .e.r{right:34px}
#ball .m{position:absolute;left:50%;top:70px;width:22px;height:11px;margin-left:-11px;border:3px solid var(--bg);border-top:0;border-radius:0 0 22px 22px;transition:all .15s}
#ball[data-f=hungry] .m{height:0;border-radius:0;width:16px;margin-left:-8px}
#ball[data-f=sad] .m{border-top:3px solid var(--bg);border-bottom:0;border-radius:22px 22px 0 0;top:74px}
#ball[data-f=sleepy] .e{height:4px;top:52px;border-radius:2px}
#ball[data-f=sleeping]{animation:settle .9s ease-out,breathe 3.4s ease-in-out .9s infinite;opacity:.8}
#ball[data-f=sleeping] .e{width:18px;height:9px;top:50px;background:none;border-radius:0 0 18px 18px;border-bottom:3px solid var(--bg)}
#ball[data-f=sleeping] .e.l{left:30px}#ball[data-f=sleeping] .e.r{right:30px}
#ball[data-f=sleeping] .m{width:12px;height:7px;border:0;border-radius:50%;background:var(--bg);margin-left:-6px;top:72px;animation:mo 3.4s ease-in-out .9s infinite}
.bub{position:absolute;left:63px;top:64px;width:34px;height:34px;border:2.5px solid var(--bg);border-radius:50%;opacity:0;transform-origin:0 45%;display:none}
.bub::after{content:'';position:absolute;left:6px;top:5px;width:9px;height:6px;border-top:2.5px solid var(--bg);border-radius:50%;transform:rotate(-30deg)}

#ball[data-f=sleeping] .bub{display:block;animation:bub 5.2s ease-in-out 1s infinite}
#ball[data-f=sleeping]::after{content:'';position:absolute;left:65px;top:66px;width:36px;height:36px;border:2px dotted var(--bg);border-radius:50%;opacity:0;animation:pop 5.2s ease-out 1s infinite;pointer-events:none}
#ball.feeding .e{transform:translateY(-9px)}
#ball.feeding .m,#ball.open .m{width:26px;height:24px;margin-left:-13px;top:64px;border:0;border-radius:50%;background:var(--bg)}
#ball.gulp{animation:gulp .2s}
#ball.gulp .e{height:5px;transform:translateY(-4px)}
#ball.yawn{animation:yawn 1.8s ease-in-out}
#ball.yawn .e{height:4px;top:50px;border-radius:2px}
#ball.yawn .m{width:26px;height:36px;margin-left:-13px;top:62px;border:0;border-radius:50%;background:var(--bg)}
#ball.happy{animation:wig .35s ease-in-out 3}
#ball.happy .e{width:16px;height:9px;top:48px;background:none;border-radius:16px 16px 0 0;border-top:3px solid var(--bg)}
#ball.happy .m{width:30px;height:15px;margin-left:-15px;top:66px}
#ball.hop{animation:hop .55s ease-out 6}
#ball.hop1{animation:hop .55s ease-out 1}
#ball.eat{animation:eat .22s}
body.sleep #shadow{animation:sh 3.4s ease-in-out .9s infinite}
.z{position:absolute;left:100px;top:34px;font-weight:800;opacity:0;display:none;pointer-events:none}
body.sleep .z{display:block;animation:zf 3.6s ease-in-out infinite}
.st,.moon{position:absolute;opacity:0;pointer-events:none}
.st{width:4px;height:4px;border-radius:50%;background:var(--fg)}
.moon{right:12%;top:6%;width:30px;height:30px;border-radius:50%;box-shadow:inset -10px -3px 0 0 var(--fg);transform:rotate(-20deg)}
body.sleep .st{animation:tw 2.6s ease-in-out infinite}
body.sleep .moon{animation:fade 1.6s ease-out forwards}
.bead{position:absolute;left:50%;top:0;border-radius:50%;background:var(--fg);border:2px solid var(--bg);opacity:0;pointer-events:none}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes breathe{0%,100%{transform:scale(1.08,.9)}50%{transform:scale(1.12,.86)}}
@keyframes hop{0%{transform:none}12%{transform:scale(1.15,.8)}40%{transform:translateY(-85px) scale(.92,1.1)}80%{transform:translateY(0) scale(1.15,.85)}100%{transform:none}}
@keyframes eat{50%{transform:scale(1.1,.92)}}
@keyframes gulp{50%{transform:scale(1.08,.92)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes yawn{0%,100%{transform:none}35%,75%{transform:scale(.94,1.12)}}
@keyframes settle{0%{transform:none}60%{transform:scale(1.14,.82)}100%{transform:scale(1.08,.9)}}
@keyframes sh{0%,100%{transform:scaleX(1.1)}50%{transform:scaleX(1.22)}}
@keyframes bub{0%,5%{transform:scale(0);opacity:0}8%{opacity:1;transform:scale(.18)}30%{transform:scale(.5,.56)}50%{transform:scale(.74,.7)}68%{transform:scale(.88,.94)}82%{transform:scale(1,.96)}85%{transform:scale(1.1);opacity:1}86%,100%{transform:scale(1.2);opacity:0}}
@keyframes pop{0%,84%{opacity:0;transform:scale(.9)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes mo{0%,100%{width:11px;height:6px;margin-left:-5px}50%{width:13px;height:10px;margin-left:-6px}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fade{to{opacity:1}}
@keyframes zf{0%{transform:translate(0,0) scale(.5) rotate(-8deg);opacity:0}15%{opacity:1}50%{transform:translate(18px,-36px) scale(1) rotate(6deg)}100%{transform:translate(6px,-84px) scale(1.3) rotate(-6deg);opacity:0}}
button{flex:1 1 28%;font:inherit;font-size:16px;padding:14px 0;border-radius:999px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.94);background:var(--fg);color:var(--bg)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#ball,.z,.st,#shadow{animation:none!important}}
#head{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#top{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:320px}
#nm{font-weight:700;font-size:20px;min-width:40px;border-bottom:2px dotted var(--dim);outline:none;user-select:text;-webkit-user-select:text}
#snd{flex:none;padding:6px 12px;font-size:13px;border-width:1.5px}
#hud{position:absolute;top:4px;left:0;right:0;text-align:center;font-weight:700;font-size:16px;display:none;pointer-events:none}
.gb{position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);pointer-events:none}
#stage.play{touch-action:none}
#stage.play #wrap{transition:transform .08s linear}
body.shopping #stage{padding-bottom:250px}
#bar{position:relative;display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:340px;padding:6px;border:2px solid var(--fg);border-radius:30px}
#pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);opacity:0;transition:transform .5s cubic-bezier(.34,1.5,.5,1),opacity .3s;pointer-events:none}
#pill::before{content:'';position:absolute;inset:0;background:var(--fg);border-radius:22px}
#pill.go::before{animation:str .5s}
@keyframes str{40%{transform:scaleX(1.35) scaleY(.9)}}
.tab{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:0;border-radius:22px;background:none;font-size:11px;transition:color .25s}
.tab:active,.tab.on:active{background:none;color:var(--fg);transform:scale(.9)}
.tab.on,.tab.on:active{color:var(--bg)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shop{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:340px;display:none;background:var(--bg);border:2px solid var(--fg);border-radius:24px;padding:10px;z-index:5;animation:up .3s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.sh-h b{flex:1;font-size:16px}
.sh-h button{flex:none;padding:5px 14px;font-size:13px;border-width:1.5px}
.sh-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border:2px solid var(--dim);border-radius:14px;font-size:11px;line-height:1.25}
.tile:active{background:var(--bg);color:var(--fg);transform:scale(.94)}
.tile em{font-style:normal;opacity:.6}
.tile.lock svg{opacity:.45}
.tile.on{border:3px solid var(--fg);padding:5px 0}
.acc{position:absolute;left:-20px;top:-60px;pointer-events:none;overflow:visible}
.f{fill:var(--fg);stroke:var(--bg);stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.b{fill:var(--bg)}
.bs{fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#drag{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:100%;max-width:320px;height:46px;border:2px solid var(--fg);border-radius:23px;display:none;touch-action:none;cursor:grab}
#knob{position:absolute;top:3px;left:calc(21px + (100% - 42px)*.5);width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--fg)}
#knob::before{content:'';position:absolute;left:11px;right:11px;top:15px;height:6px;border-top:2px solid var(--bg);border-bottom:2px solid var(--bg)}
#mnu{flex:none;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-width:1.5px}
#mnu svg{width:20px;height:20px;fill:currentColor}
#mnu:active svg{fill:var(--bg)}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(24px,calc((100% - 320px)/2));width:200px;display:none;background:var(--bg);border:2px solid var(--fg);border-radius:20px;padding:6px 14px;z-index:20;animation:pop2 .18s ease-out}
@keyframes pop2{from{opacity:0;transform:translateY(-6px)}}
.mr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:15px}
.mr+.mr{border-top:1.5px solid var(--dim)}
#quit{position:absolute;top:0;right:0;flex:none;padding:5px 14px;font-size:13px;border-width:1.5px;display:none;z-index:3}
#ask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:30}
.card{background:var(--bg);border:2px solid var(--fg);border-radius:24px;padding:20px;width:min(86%,300px);text-align:center}
.card b{font-size:18px}
.card p{margin:8px 0 16px;font-size:14px;line-height:1.4}
.row{display:flex;gap:10px}
.row button{padding:12px 0}
#yes{background:var(--fg);color:var(--bg)}
#stats{display:flex;gap:18px;width:100%;max-width:230px;opacity:.8}
.s{flex:1;display:flex;align-items:center;gap:6px}
.s svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s i{flex:1;display:block;height:4px;border-radius:2px;background:var(--dim);overflow:hidden}
.s b{display:block;height:100%;background:var(--fg);border-radius:2px;transition:width .4s}
.s.low{animation:lowp 1.6s ease-in-out infinite}
@keyframes lowp{50%{opacity:.3}}
</style>
</head>
<body>
<div id="head"><div id="top"><span id="nm" contenteditable="true" spellcheck="false">Pip</span><button id="mnu" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button></div>
<div id="stats">
  <div class="s" role="img" aria-label="Belly"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><circle cx="12" cy="16" r="2.6"/></svg><i><b id="h"></b></i></div>
  <div class="s" role="img" aria-label="Fun"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M6 20q6-5 12 0"/></svg><i><b id="f"></b></i></div>
  <div class="s" role="img" aria-label="Rest"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><i><b id="e"></b></i></div>
</div>
</div>
<div id="stage">
  <div id="msg"></div>
  <div id="hud"></div><button id="quit">Exit</button><div id="drag"><div id="knob"></div></div><div id="shop"></div><span class="moon"></span>
  <span class="st" style="left:10%;top:16%"></span><span class="st" style="left:26%;top:6%;animation-delay:.7s"></span><span class="st" style="left:78%;top:30%;animation-delay:1.3s"></span><span class="st" style="left:16%;top:44%;animation-delay:.3s"></span><span class="st" style="left:88%;top:56%;animation-delay:1.9s"></span><span class="st" style="left:6%;top:70%;animation-delay:1.1s"></span>
  <div id="wrap"><div id="shadow"></div>
    <div id="ball"><span class="e l"></span><span class="e r"></span><span class="m"></span><span class="bub"></span><svg id="acc" class="acc" viewBox="-20 -60 160 180" width="160" height="180"></svg></div>
    <span class="z" style="animation-delay:0s;font-size:15px">z</span><span class="z" style="animation-delay:1.2s;font-size:19px">z</span><span class="z" style="animation-delay:2.4s;font-size:24px">Z</span>
  </div>
</div>
<div id="bar"><div id="pill"></div>
  <button class="tab" id="bf"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><circle cx="12" cy="16" r="2.6"/></svg><span>Feed</span></button>
  <button class="tab" id="bp"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M6 20q6-5 12 0"/></svg><span>Play</span></button>
  <button class="tab" id="bs"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="bsl">Sleep</span></button>
  <button class="tab" id="bg"><svg viewBox="0 0 24 24"><path d="M12 3v10M8 10l4 4 4-4M5 19h14"/></svg><span>Catch</span></button>
  <button class="tab" id="bw"><svg viewBox="0 0 24 24"><path d="M8 15V6h8v9M4 15h16M8 11h8"/></svg><span>Wear</span></button>
</div>
<div id="menu"><div class="mr"><span>Day</span><b id="mDay"></b></div><div class="mr"><span>Coins</span><b id="mCoins"></b></div><div class="mr"><span>Sound</span><button id="snd">On</button></div></div>
<div id="ask"><div class="card"><b>Play Catch?</b><p>Slide to move Pip and catch the beads. It lasts 20 seconds.</p><div class="row"><button id="no">Not now</button><button id="yes">Play</button></div></div></div>
<script>
(function(){
  var KEY="pip-ball-v1", st={h:80,f:80,e:80,t:Date.now(),z:false}, busy=false,note='',noteUntil=0;
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s)st=s}catch(x){}
  st.c=st.c||0;st.own=st.own||{};st.on=st.on||{};st.b=st.b||Date.now();st.n=st.n||'Pip';var muted=!!st.m,AC;
  var $=function(i){return document.getElementById(i)}, ball=$("ball"), wrap=$("wrap"), msg=$("msg");
  var cl=function(v){return Math.max(0,Math.min(100,v))};
  function tick(sec){
    if(st.z){st.e=cl(st.e+sec*0.5);st.h=cl(st.h-sec*6/3600);st.f=cl(st.f-sec*3/3600);if(st.e>=100)st.z=false}
    else{st.h=cl(st.h-sec*6/3600);st.f=cl(st.f-sec*8/3600);st.e=cl(st.e-sec*4/3600)}
  }
  tick(Math.min((Date.now()-st.t)/1000,172800)); st.t=Date.now();
  function save(){st.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(x){}}
  function fx(c,ms){ball.classList.remove(c);void ball.offsetWidth;ball.classList.add(c);var done=function(e){if(e&&e.target!==ball)return;ball.classList.remove(c);ball.removeEventListener("animationend",done)};ball.addEventListener("animationend",done);setTimeout(done,ms+400)}
  function render(){
    ["h","f","e"].forEach(function(k){$(k).parentNode.parentNode.classList.toggle("low",st[k]<25)});$("h").style.width=st.h+"%";$("f").style.width=st.f+"%";$("e").style.width=st.e+"%";
    var m=Math.min(st.h,st.f,st.e), face="", text="Happy";
    if(st.z){face="sleeping";text="Sleeping"}
    else if(st.e<20){face="sleepy";text="Sleepy"}
    else if(st.h<25){face="hungry";text="Hungry"}
    else if(st.f<25){face="sad";text="Bored"}
    else if(m>75){text="Very happy"}
    ball.dataset.f=face;
    document.body.classList.toggle("sleep",st.z);
    $("bsl").textContent=st.z?"Wake":"Sleep";
    if(Date.now()<noteUntil)text=note;
    msg.textContent=text;
    if(window.ITEMS)ITEMS.forEach(function(it){var g=$("g-"+it[0]);if(g)g.style.display=st.on[it[0]]?"inline":"none"});
    $("mDay").textContent=Math.floor((Date.now()-st.b)/864e5)+1;$("mCoins").textContent=st.c;
    $("snd").textContent=muted?"Off":"On";
  }
  function beep(f,d,tp){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=tp||"sine";o.frequency.value=f;g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
  var nm=$("nm");st.n=String(st.n).slice(0,7);nm.textContent=st.n;
  nm.oninput=function(){if(nm.textContent.length>7){nm.textContent=nm.textContent.slice(0,7);var r=document.createRange();r.selectNodeContents(nm);r.collapse(false);var q=getSelection();q.removeAllRanges();q.addRange(r)}};
  nm.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();nm.blur()}};
  nm.onblur=function(){st.n=nm.textContent.trim()||"Pip";nm.textContent=st.n;save()};
  $("snd").onclick=function(){muted=!muted;st.m=muted;beep(600,.08);render();save()};
  var G={
tophat:'<rect class="f" x="34" y="-36" width="52" height="34" rx="4" transform="rotate(-6 60 0)"/><rect class="f" x="22" y="-5" width="76" height="10" rx="5" transform="rotate(-6 60 0)"/><rect class="b" x="34" y="-14" width="52" height="7" transform="rotate(-6 60 0)"/>',
party:'<g transform="rotate(8 60 0)"><path class="f" d="M36 4L84 4L60 -46Z"/><path class="bs" d="M45 -10h30M51 -24h18"/><circle class="f" cx="60" cy="-48" r="6"/></g>',
crown:'<path class="f" d="M33 6L29 -24L46 -9L60 -30L74 -9L91 -24L87 6Z"/><path class="bs" d="M35 -3h50"/><circle class="b" cx="60" cy="-14" r="3.5"/>',
ears:'<path class="f" d="M16 28L20 -24L54 0Z"/><path class="f" d="M104 28L100 -24L66 0Z"/><path class="b" d="M26 8L28 -10L42 2Z"/><path class="b" d="M94 8L92 -10L78 2Z"/>',
glasses:'<circle class="bs" cx="40" cy="52" r="17"/><circle class="bs" cx="80" cy="52" r="17"/><path class="bs" d="M57 49q3-4 6 0"/>',
shades:'<path class="f" d="M20 42h38v12q0 12-10 12h-18q-10 0-10-12zM62 42h38v12q0 12-10 12h-18q-10 0-10-12z"/><path class="bs" d="M28 49l7-3M70 49l7-3" style="stroke-width:2"/>',
bow:'<path class="b" d="M60 104L38 92L38 116ZM60 104L82 92L82 116Z"/><rect class="b" x="54" y="97" width="12" height="14" rx="4"/>',
phones:'<path d="M-2 56A62 62 0 0 1 122 56" fill="none" stroke="var(--bg)" stroke-width="12" stroke-linecap="round"/><path d="M-2 56A62 62 0 0 1 122 56" fill="none" stroke="var(--fg)" stroke-width="6" stroke-linecap="round"/><rect class="f" x="-12" y="42" width="18" height="34" rx="7"/><rect class="f" x="114" y="42" width="18" height="34" rx="7"/>'};
  window.ITEMS=[["tophat","Top hat","head",10],["party","Party hat","head",8],["crown","Crown","head",25],["ears","Cat ears","head",12],["glasses","Glasses","face",10],["shades","Shades","face",15],["bow","Bow tie","extra",8],["phones","Phones","extra",18]];
  $("acc").innerHTML=ITEMS.map(function(it){return '<g id="g-'+it[0]+'" style="display:none">'+G[it[0]]+'</g>'}).join("");
  function shop(){
    var sh=$("shop");
    sh.innerHTML='<div class="sh-h"><b>Wardrobe</b><span>'+st.c+' coins</span><button id="sx">Done</button></div><div class="sh-g"></div>';
    var g=sh.querySelector(".sh-g");
    ITEMS.forEach(function(it){
      var k=it[0],own=st.own[k],on=st.on[k],t=document.createElement("button");
      t.className="tile"+(on?" on":"")+(own?"":" lock");
      t.innerHTML='<svg viewBox="-30 -60 180 190" width="50" height="50"><circle cx="60" cy="60" r="60" style="fill:var(--fg)"/>'+G[k]+'</svg><span>'+it[1]+'</span><em>'+(on?"Wearing":own?"Owned":it[3]+" coins")+'</em>';
      t.onclick=function(){
        if(!own){if(st.c<it[3]){say("Need "+(it[3]-st.c)+" more coins",1600);beep(150,.15);return}st.c-=it[3];st.own[k]=1;beep(700,.12)}
        if(on){st.on[k]=0}else{ITEMS.forEach(function(o){if(o[2]===it[2])st.on[o[0]]=0});st.on[k]=1;fx("hop1",550)}
        render();save();shop()};
      g.appendChild(t)});
    $("sx").onclick=closeShop;
  }
  function closeShop(){$("shop").style.display="none";document.body.classList.remove("shopping")}
  function openShop(){shop();$("shop").style.display="block";document.body.classList.add("shopping")}
  $("bw").onclick=function(){if($("shop").style.display==="block")closeShop();else openShop()};
  function game(){
    if(busy)return; busy=true; st.z=false; render(); closeShop();
    var stg=$("stage"),hud=$("hud"),dr=$("drag"),kn=$("knob"),sc=0,list=[],tEnd=performance.now()+20000,last=performance.now(),spawn=0,R=Math.max(10,stg.clientWidth/2-72),dragging=false,over=false;
    ball.classList.add("feeding");stg.classList.add("play");hud.style.display="block";dr.style.display="block";$("quit").style.display="block";$("quit").onclick=function(){end(false)};say("Slide to move",1800);
    function setT(t){t=Math.max(0,Math.min(1,t));kn.style.left="calc(21px + (100% - 42px)*"+t+")";wrap.style.transform="translateX("+((t-.5)*2*R)+"px)"}
    function fromEv(e){if(over)return;var r=dr.getBoundingClientRect();setT((e.clientX-r.left-21)/(r.width-42))}
    dr.onpointerdown=function(e){dragging=true;try{dr.setPointerCapture(e.pointerId)}catch(x){}fromEv(e)};
    dr.onpointermove=function(e){if(dragging)fromEv(e)};
    dr.onpointerup=dr.onpointercancel=function(){dragging=false};
    setT(.5);
    function end(done){
      if(over)return;over=true;dragging=false;dr.onpointerdown=dr.onpointermove=dr.onpointerup=dr.onpointercancel=null;
      dr.style.display="none";$("quit").style.display="none";hud.style.display="none";
      list.forEach(function(b){b.el.remove()});
      wrap.style.transition="transform .45s cubic-bezier(.34,1.4,.5,1)";wrap.style.transform="translateX(0)";
      setTimeout(function(){wrap.style.transition="";wrap.style.transform="";stg.classList.remove("play")},500);
      ball.classList.remove("feeding");
      st.c+=sc;st.f=cl(st.f+Math.min(40,sc*3));st.e=cl(st.e-10);
      if(done){ball.classList.add("happy");hearts();say("+"+sc+" coins",2200);beep(784,.18)}else say(sc?"+"+sc+" coins":"Back to Pip",1600);
      setTimeout(function(){ball.classList.remove("happy");busy=false},done?1100:550);
      render();save()
    }
    function frame(now){
      if(over)return;var dt=Math.min(.05,(now-last)/1000);last=now;var left=tEnd-now;
      if(left<=0){end(true);return}
      spawn-=dt;
      if(spawn<=0){spawn=.45+Math.random()*.25;var el=document.createElement("span");el.className="gb";stg.appendChild(el);list.push({el:el,x:stg.clientWidth/2+(Math.random()*2-1)*R-6,y:-14,v:140+(20000-left)/110})}
      var sr=stg.getBoundingClientRect(),br=ball.getBoundingClientRect(),cx=br.left+br.width/2-sr.left,ty=br.top-sr.top;
      for(var i=list.length-1;i>=0;i--){var b=list[i];b.y+=b.v*dt;
        if(b.y+6>ty+55&&b.y+6<ty+98&&Math.abs(b.x+6-cx)<42){sc++;b.el.remove();list.splice(i,1);fx("gulp",200);beep(480+sc*14,.07,"triangle");continue}
        if(b.y>sr.height){b.el.remove();list.splice(i,1);continue}
        b.el.style.transform="translate("+b.x+"px,"+b.y+"px)"}
      hud.textContent="Caught "+sc+"   "+Math.ceil(left/1000)+"s";
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame);
  }
  $("bg").onclick=function(){if(!busy)$("ask").style.display="flex"};
  function say(t,ms){note=t;noteUntil=Date.now()+ms;render()}
  function hearts(){for(var i=0;i<3;i++)(function(i){var h=document.createElement("span");h.textContent="\u2665";h.className="bead";h.style.cssText="width:auto;height:auto;border:0;background:none;font-size:15px;margin-left:"+(-34+i*30)+"px;top:22px";wrap.appendChild(h);h.animate([{transform:"translateY(0) scale(.5)",opacity:0},{opacity:1,offset:.3},{transform:"translateY(-50px) scale(1)",opacity:0}],{duration:1300,delay:i*220,easing:"ease-out",fill:"both"}).onfinish=function(){h.remove()}})(i)}
  function feed(){
    if(busy)return; busy=true; st.z=false; render();
    ball.classList.add("feeding");
    var n=9,t0=500;
    for(var i=0;i<n;i++)(function(i){
      var d=t0+i*270+Math.random()*80, b=document.createElement("span"), dx=Math.random()*90-45, sz=8+Math.random()*5;
      b.className="bead"; b.style.width=b.style.height=sz+"px"; b.style.marginLeft=(-sz/2)+"px"; wrap.appendChild(b);
      var a=b.animate([
        {transform:"translate("+dx+"px,-95px)",opacity:0},
        {opacity:1,offset:.15},
        {transform:"translate("+dx*.35+"px,25px)",opacity:1,offset:.6},
        {transform:"translate(0,112px) scale(.6)",opacity:1,offset:.95},
        {transform:"translate(0,116px) scale(0)",opacity:0}
      ],{duration:850,delay:d,easing:"ease-in",fill:"both"});
      a.onfinish=function(){b.remove()};
      setTimeout(function(){fx("gulp",200);beep(260+Math.random()*120,.07,"triangle");st.h=cl(st.h+3.5);render();save()},d+800);
    })(i);
    var end=t0+n*270+1100;
    setTimeout(function(){ball.classList.remove("feeding");ball.classList.add("happy");say("Yum!",1800);hearts();st.c++;beep(660,.12);render();save()},end);
    setTimeout(function(){ball.classList.remove("happy");busy=false},end+1100);
  }
  function play(){
    if(busy)return; busy=true; st.z=false; st.f=cl(st.f+30); st.e=cl(st.e-8); st.c+=2; beep(440,.1); render();
    ball.classList.add("hop");
    var p=[0,-85,75,-65,55,0].map(function(x){return {transform:"translateX("+x+"px)"}});
    wrap.animate(p,{duration:3300,easing:"ease-in-out"});
    setTimeout(function(){ball.classList.remove("hop");busy=false;save()},3300);
  }
  $("bf").onclick=feed;
  $("bp").onclick=play;
  $("bs").onclick=function(){
    if(busy)return;
    if(st.z){st.z=false;render();fx("hop1",550);say("Good morning",1500);save();return}
    busy=true;ball.classList.add("yawn");say("Yawn\u2026",1800);beep(200,.5);
    setTimeout(function(){ball.classList.remove("yawn");st.z=true;busy=false;render();save()},1800);
  };
  wrap.onclick=function(){if(busy)return;if(st.z){st.z=false}else{st.f=cl(st.f+4)}fx("hop1",550);render();save()};
  setInterval(function(){tick(1);render();save()},1000);
  setInterval(function(){if(!st.z&&!busy&&Math.random()<.35)fx("hop1",550)},7000);
  var TABS=["bf","bp","bs","bg","bw"],pill=$("pill");
  function moveTo(i){TABS.forEach(function(t,j){$(t).classList.toggle("on",j===i)});pill.style.opacity=1;pill.style.transform="translateX("+i*100+"%)";pill.classList.remove("go");void pill.offsetWidth;pill.classList.add("go")}
  TABS.forEach(function(id,i){var b=$(id),fn=b.onclick;b.onclick=function(){var was=busy;fn();if((!was&&i!==3)||i===4)moveTo(i)}});
  function hideAsk(){$("ask").style.display="none"}
  $("no").onclick=hideAsk;
  $("ask").onclick=function(e){if(e.target===this)hideAsk()};
  $("yes").onclick=function(){hideAsk();if(!busy){moveTo(3);game()}};
  var mn=$("menu"),mb=$("mnu");
  mb.onclick=function(){mn.style.display=mn.style.display==="block"?"none":"block"};
  document.addEventListener("pointerdown",function(e){if(mn.style.display==="block"&&!mn.contains(e.target)&&!mb.contains(e.target))mn.style.display="none"});
  ["copy","cut","paste","contextmenu","dragstart","dragover","drop","gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
  document.addEventListener("selectstart",function(e){if(!nm.contains(e.target))e.preventDefault()});
  document.addEventListener("wheel",function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&["+","-","=","0","c","v","x","a"].indexOf(e.key.toLowerCase())>-1)e.preventDefault()});
  render();
})();
